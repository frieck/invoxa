name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Create the draft release first (no build needed) ────────────────────
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        id: create
        with:
          tag_name: ${{ github.ref_name }}
          name: Invoxa ${{ github.ref_name }}
          body: |
            ## Invoxa ${{ github.ref_name }}

            ### Download
            - **macOS Apple Silicon** — `Invoxa_aarch64.dmg`
            - **macOS Intel** — `Invoxa_x64.dmg`
            - **Windows** — `Invoxa_x64-setup.exe`

            > First time on macOS: right-click the app → Open (bypasses Gatekeeper).
          draft: true
          prerelease: false

  # ── macOS builds ─────────────────────────────────────────────────────────
  build-macos:
    needs: create-release
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: yarn install --frozen-lockfile

      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            cfg.version = '$VERSION';
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(cfg, null, 2));
          "

      - name: Write signing key to file
        run: |
          mkdir -p /tmp/tauri-keys
          echo "$TAURI_SIGNING_PRIVATE_KEY" | base64 -d > /tmp/tauri-keys/invoxa.key
          chmod 600 /tmp/tauri-keys/invoxa.key
          echo "Key first line: $(head -1 /tmp/tauri-keys/invoxa.key)"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PATH: /tmp/tauri-keys/invoxa.key
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.target }}

      - name: Check generated .sig files
        if: always()
        run: find src-tauri/target -name "*.sig" 2>/dev/null || echo "No .sig files found"

  # ── Windows build ─────────────────────────────────────────────────────────
  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: yarn install --frozen-lockfile

      - name: Set version from tag
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            cfg.version = '$VERSION';
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(cfg, null, 2));
          "

      - name: Write signing key to file
        shell: bash
        run: |
          mkdir -p /tmp/tauri-keys
          echo "$TAURI_SIGNING_PRIVATE_KEY" | base64 -d > /tmp/tauri-keys/invoxa.key
          echo "Key first line: $(head -1 /tmp/tauri-keys/invoxa.key)"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PATH: /tmp/tauri-keys/invoxa.key
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --bundles nsis

      - name: Check generated .sig files
        if: always()
        shell: bash
        run: find src-tauri/target -name "*.sig" 2>/dev/null || echo "No .sig files found"

  # ── Publish: generate latest.json and undraft the release ────────────────
  publish-release:
    needs: [create-release, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate latest.json and publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ github.ref_name }}
          VERSION=${TAG#v}

          echo "=== Release assets ==="
          gh release view "$TAG" --repo frieck/invoxa --json assets --jq '.assets[].name'

          gh release download "$TAG" --repo frieck/invoxa -p "*.sig" -D /tmp/sigs || true
          echo "=== Downloaded .sig files ==="
          ls /tmp/sigs/ 2>/dev/null || echo "none"

          AARCH64_SIG_FILE=$(find /tmp/sigs -name "*aarch64*.sig" 2>/dev/null | head -1)
          X64_SIG_FILE=$(find /tmp/sigs -name "*x64*.app*sig" 2>/dev/null | head -1)
          WIN_SIG_FILE=$(find /tmp/sigs -name "*setup*.sig" 2>/dev/null | head -1)

          AARCH64_SIG=$(cat "$AARCH64_SIG_FILE" 2>/dev/null || echo "")
          X64_SIG=$(cat "$X64_SIG_FILE" 2>/dev/null || echo "")
          WIN_SIG=$(cat "$WIN_SIG_FILE" 2>/dev/null || echo "")

          AARCH64_BUNDLE=$(gh release view "$TAG" --repo frieck/invoxa --json assets --jq '.assets[].name' | grep -E "aarch64.*app.*tar.*gz$" | head -1)
          X64_BUNDLE=$(gh release view "$TAG" --repo frieck/invoxa --json assets --jq '.assets[].name' | grep -E "x64.*app.*tar.*gz$" | head -1)
          WIN_BUNDLE=$(gh release view "$TAG" --repo frieck/invoxa --json assets --jq '.assets[].name' | grep -E "setup\.exe$" | head -1)

          echo "aarch64 bundle: $AARCH64_BUNDLE"
          echo "x64 bundle: $X64_BUNDLE"
          echo "win bundle: $WIN_BUNDLE"

          jq -n \
            --arg version "$VERSION" \
            --arg notes "See release notes at https://github.com/frieck/invoxa/releases/tag/$TAG" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg aarch64_sig "$AARCH64_SIG" \
            --arg aarch64_url "https://github.com/frieck/invoxa/releases/download/$TAG/$AARCH64_BUNDLE" \
            --arg x64_sig "$X64_SIG" \
            --arg x64_url "https://github.com/frieck/invoxa/releases/download/$TAG/$X64_BUNDLE" \
            --arg win_sig "$WIN_SIG" \
            --arg win_url "https://github.com/frieck/invoxa/releases/download/$TAG/$WIN_BUNDLE" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": {signature: $aarch64_sig, url: $aarch64_url},
                "darwin-x86_64":  {signature: $x64_sig,    url: $x64_url},
                "windows-x86_64": {signature: $win_sig,    url: $win_url}
              }
            }' > latest.json

          echo "=== latest.json ==="
          cat latest.json

          gh release upload "$TAG" latest.json --repo frieck/invoxa --clobber
          gh release edit "$TAG" --repo frieck/invoxa --draft=false
